<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200" role="img" aria-label="Analyst loop: observe, correlate, investigate, improve">
  <title>observe → correlate → investigate → improve</title>
  <style>
    text{font-family:'Fira Code','JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace}
    .halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-out infinite}
    @keyframes halo{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.45)}}
    .spin{transform-box:fill-box;transform-origin:center;animation:spin linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect width="1000" height="200" rx="12" fill="#050816"/>
  <path id="back" d="M875 46C875 0 125 0 125 46" fill="none" stroke="#39ff88" stroke-opacity=".25" stroke-width="1.5" stroke-dasharray="2 6"/><circle r="3.5" fill="#39ff88"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#back"/></animateMotion></circle>
  <path id="p0" d="M175 92H325" stroke="#00d9ff" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 6"/><path d="M317 86L325 92L317 98" fill="none" stroke="#00d9ff" stroke-opacity=".6" stroke-width="2"/><circle r="4" fill="#ffb000" opacity="0"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><circle r="4" fill="#ffb000" opacity="0"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p0"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle><path id="p1" d="M425 92H575" stroke="#00d9ff" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 6"/><path d="M567 86L575 92L567 98" fill="none" stroke="#00d9ff" stroke-opacity=".6" stroke-width="2"/><circle r="4" fill="#ff3864" opacity="0"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></circle><circle r="4" fill="#ff3864" opacity="0"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></circle><path id="p2" d="M675 92H825" stroke="#00d9ff" stroke-opacity=".3" stroke-width="2" stroke-dasharray="3 6"/><path d="M817 86L825 92L817 98" fill="none" stroke="#00d9ff" stroke-opacity=".6" stroke-width="2"/><circle r="4" fill="#39ff88" opacity="0"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle><circle r="4" fill="#39ff88" opacity="0"><animateMotion dur="2.4s" begin="2.4s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="2.4s" repeatCount="indefinite"/></circle>
  <g><circle cx="125" cy="92" r="44" fill="#0b1f3a" stroke="#00d9ff" stroke-width="2"/><circle cx="125" cy="92" r="44" fill="none" stroke="#00d9ff" class="halo" style="animation-delay:0.0s"/><circle cx="125" cy="92" r="34" fill="none" stroke="#00d9ff" stroke-opacity=".35" stroke-dasharray="4 6" class="spin" style="animation-duration:8s"/><text x="125" y="99" text-anchor="middle" font-size="20" fill="#00d9ff" font-weight="700">01</text><text x="125" y="164" text-anchor="middle" font-size="15" fill="#e6f7ff" letter-spacing="3" font-weight="700">OBSERVE</text><text x="125" y="186" text-anchor="middle" font-size="12" fill="#5f7a94">telemetry · logs</text></g><g><circle cx="375" cy="92" r="44" fill="#0b1f3a" stroke="#ffb000" stroke-width="2"/><circle cx="375" cy="92" r="44" fill="none" stroke="#ffb000" class="halo" style="animation-delay:0.75s"/><circle cx="375" cy="92" r="34" fill="none" stroke="#ffb000" stroke-opacity=".35" stroke-dasharray="4 6" class="spin" style="animation-duration:10s"/><text x="375" y="99" text-anchor="middle" font-size="20" fill="#ffb000" font-weight="700">02</text><text x="375" y="164" text-anchor="middle" font-size="15" fill="#e6f7ff" letter-spacing="3" font-weight="700">CORRELATE</text><text x="375" y="186" text-anchor="middle" font-size="12" fill="#5f7a94">SIEM · rules</text></g><g><circle cx="625" cy="92" r="44" fill="#0b1f3a" stroke="#ff3864" stroke-width="2"/><circle cx="625" cy="92" r="44" fill="none" stroke="#ff3864" class="halo" style="animation-delay:1.5s"/><circle cx="625" cy="92" r="34" fill="none" stroke="#ff3864" stroke-opacity=".35" stroke-dasharray="4 6" class="spin" style="animation-duration:12s"/><text x="625" y="99" text-anchor="middle" font-size="20" fill="#ff3864" font-weight="700">03</text><text x="625" y="164" text-anchor="middle" font-size="15" fill="#e6f7ff" letter-spacing="3" font-weight="700">INVESTIGATE</text><text x="625" y="186" text-anchor="middle" font-size="12" fill="#5f7a94">triage · evidence</text></g><g><circle cx="875" cy="92" r="44" fill="#0b1f3a" stroke="#39ff88" stroke-width="2"/><circle cx="875" cy="92" r="44" fill="none" stroke="#39ff88" class="halo" style="animation-delay:2.25s"/><circle cx="875" cy="92" r="34" fill="none" stroke="#39ff88" stroke-opacity=".35" stroke-dasharray="4 6" class="spin" style="animation-duration:14s"/><text x="875" y="99" text-anchor="middle" font-size="20" fill="#39ff88" font-weight="700">04</text><text x="875" y="164" text-anchor="middle" font-size="15" fill="#e6f7ff" letter-spacing="3" font-weight="700">IMPROVE</text><text x="875" y="186" text-anchor="middle" font-size="12" fill="#5f7a94">lessons · tuning</text></g>
</svg>
