<svg xmlns="http://www.w3.org/2000/svg" width="900" height="438" viewBox="0 0 900 438" role="img" aria-label="Terminal: whoami, mission and focus areas">
  <title>Operator terminal</title>
  <defs><clipPath id="l0"><rect x="28" y="54" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0250;0.0650;0.9250;1" values="0;0;194;194;0"/></rect></clipPath><clipPath id="l1"><rect x="28" y="84" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0869;0.1025;0.9250;1" values="0;0;588;588;0"/></rect></clipPath><clipPath id="l2"><rect x="28" y="114" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1119;0.1275;0.9250;1" values="0;0;511;511;0"/></rect></clipPath><clipPath id="l3"><rect x="28" y="144" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1369;0.1769;0.9250;1" values="0;0;194;194;0"/></rect></clipPath><clipPath id="l4"><rect x="28" y="174" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.1987;0.2144;0.9250;1" values="0;0;502;502;0"/></rect></clipPath><clipPath id="l5"><rect x="28" y="204" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2237;0.2394;0.9250;1" values="0;0;300;300;0"/></rect></clipPath><clipPath id="l6"><rect x="28" y="234" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.2487;0.3137;0.9250;1" values="0;0;290;290;0"/></rect></clipPath><clipPath id="l7"><rect x="28" y="264" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3356;0.3512;0.9250;1" values="0;0;454;454;0"/></rect></clipPath><clipPath id="l8"><rect x="28" y="294" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3606;0.3762;0.9250;1" values="0;0;550;550;0"/></rect></clipPath><clipPath id="l9"><rect x="28" y="324" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.3856;0.4181;0.9250;1" values="0;0;166;166;0"/></rect></clipPath><clipPath id="l10"><rect x="28" y="354" height="28" width="0"><animate attributeName="width" dur="16.0s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.4400;0.4556;0.9250;1" values="0;0;454;454;0"/></rect></clipPath>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0b1f3a"/><stop offset="1" stop-color="#0d2a4d"/>
    </linearGradient>
  </defs>
  <style>
    text{font-family:'Fira Code','JetBrains Mono','Cascadia Code',Consolas,'Courier New',monospace;font-size:16px;white-space:pre}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .border{stroke-dasharray:6 10;animation:march 1.2s linear infinite}
    @keyframes march{to{stroke-dashoffset:-16}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <rect x="1" y="1" width="898" height="436" rx="12" fill="#050816" stroke="#00d9ff" stroke-opacity=".35"/>
  <rect x="1" y="1" width="898" height="436" rx="12" fill="none" stroke="#00d9ff" stroke-opacity=".6" class="border"/>
  <path d="M1 40V13A12 12 0 0 1 13 1H887A12 12 0 0 1 899 13V40Z" fill="url(#bar)"/>
  <circle cx="26" cy="21" r="6" fill="#ff3864"/><circle cx="46" cy="21" r="6" fill="#ffb000"/><circle cx="66" cy="21" r="6" fill="#39ff88"/>
  <text x="450.0" y="26" text-anchor="middle" fill="#5f7a94" font-size="13" style="font-size:13px">analyst@soc-lab: ~/profile</text>
  <text x="32" y="74" clip-path="url(#l0)"><tspan fill="#39ff88">❯ </tspan><tspan fill="#e6f7ff">whoami --verbose</tspan></text><text x="32" y="104" clip-path="url(#l1)"><tspan fill="#9fb6cc">Prayatna Pokhrel · Cybersecurity &amp; Ethical Hacking undergrad</tspan></text><text x="32" y="134" clip-path="url(#l2)"><tspan fill="#9fb6cc">Softwarica College · BSc (Hons), Coventry University</tspan></text><text x="32" y="164" clip-path="url(#l3)"><tspan fill="#39ff88">❯ </tspan><tspan fill="#e6f7ff">cat /etc/mission</tspan></text><text x="32" y="194" clip-path="url(#l4)"><tspan fill="#9fb6cc">target_role: SOC Analyst  |  base: Kathmandu, Nepal</tspan></text><text x="32" y="224" clip-path="url(#l5)"><tspan fill="#9fb6cc">studying:    CompTIA Security+</tspan></text><text x="32" y="254" clip-path="url(#l6)"><tspan fill="#39ff88">❯ </tspan><tspan fill="#e6f7ff">tail -f /var/log/focus.log</tspan></text><text x="32" y="284" clip-path="url(#l7)"><tspan fill="#39ff88">[OK]  security monitoring   [OK]  alert triage</tspan></text><text x="32" y="314" clip-path="url(#l8)"><tspan fill="#39ff88">[OK]  log analysis          [OK]  incident investigation</tspan></text><text x="32" y="344" clip-path="url(#l9)"><tspan fill="#39ff88">❯ </tspan><tspan fill="#e6f7ff">echo $MINDSET</tspan></text><text x="32" y="374" clip-path="url(#l10)"><tspan fill="#00d9ff">observe -&gt; correlate -&gt; investigate -&gt; improve</tspan></text>
  <text x="32" y="404"><tspan fill="#39ff88">❯ </tspan><tspan fill="#00d9ff" class="cursor">█</tspan></text>
</svg>
